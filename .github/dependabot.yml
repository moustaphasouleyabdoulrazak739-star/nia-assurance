version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Montees majeures et mineures de Django faites a la main (notes de
      # version, migrations, tests complets). Les correctifs restent proposes.
      - dependency-name: "Django"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # Changements majeurs non testes, voir SECURITY.md (risques acceptes).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    ignore:
      # Versions fixees par le SDK Expo : on les monte uniquement via
      # "npx expo install --fix" lors d'une mise a jour du SDK.
      - dependency-name: "react-native"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
